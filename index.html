<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Quizlet App</title>
    <script>
      // Застосовуємо тему ДО завантаження Vue: інакше при темній темі сторінка
      // на мить «блимне» світлою, поки не виконається JS застосунку.
      // Ключ і логіка — ті самі, що в src/composables/useTheme.ts
      try {
        var mode = JSON.parse(localStorage.getItem('quizlet-app:theme') || '"system"')
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
        if (mode === 'dark' || (mode === 'system' && prefersDark)) {
          document.documentElement.classList.add('dark')
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
