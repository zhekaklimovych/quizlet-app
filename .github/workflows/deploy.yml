# Автодеплой на GitHub Pages.
# На кожен push у main: встановлення → тести → збірка → публікація.
# Якщо тести або перевірка типів не пройдуть — сайт НЕ оновиться.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # кнопка «Run workflow» у вкладці Actions

# Мінімальні права: читати код, публікувати Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Якщо запушити двічі поспіль — попередній деплой скасовується
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      # npm ci також запускає postinstall → `nuxt prepare` (генерує типи в .nuxt/)
      - name: Install dependencies
        run: npm ci

      - name: Tests (unit + nuxt)
        run: npx vitest run

      - name: Type-check
        run: npx nuxt typecheck

      # Статична збірка. Для SPA (ssr: false) Nuxt сам створює 404.html і 200.html —
      # GitHub Pages віддає 404.html на невідомі адреси, і далі роутер відкриває потрібну сторінку.
      - name: Generate static site
        run: npx nuxt generate
        env:
          NUXT_APP_BASE_URL: /${{ github.event.repository.name }}/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
