# Автодеплой на GitHub Pages.
# На кожен push у main: встановлення → тести → збірка → публікація.
# Якщо тести або перевірка типів не пройдуть — сайт НЕ оновиться.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # кнопка «Run workflow» у вкладці Actions

# Мінімальні права: читати код, публікувати Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Якщо запушити двічі поспіль — попередній деплой скасовується
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npx vitest run

      - name: Type-check and build
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      # GitHub Pages не знає маршрутів SPA: /quizlet-app/sets/123 для нього — неіснуючий файл.
      # На невідомі адреси він віддає 404.html — робимо його копією index.html,
      # і далі Vue Router сам відкриває потрібну сторінку.
      - name: SPA fallback
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
